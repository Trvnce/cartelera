# Compila la app de iPhone en un Mac de GitHub y publica el .ipa SIN FIRMAR como
# descarga (Releases). SideStore/AltStore lo firma con el Apple ID de quien lo instala.
# Se lanza a mano (Actions › iOS › Run workflow) o al subir cambios de la app.
name: iOS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/ios.yml']

permissions:
  contents: write # para crear la Release con el .ipa

jobs:
  ipa:
    # macos-26 se queda sin equipos libres a menudo; macos-15 trae Xcode 26 (Liquid Glass).
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26' # la más reciente 26.x instalada en el equipo

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true

      - name: Versiones
        run: |
          flutter --version
          xcodebuild -version

      - run: flutter pub get

      # flutter genera la configuración y compila el Dart; xcodebuild compila la app con la
      # firma desactivada en TODOS los objetivos (las dependencias Swift de los controles
      # nativos piden un equipo de desarrollo si no). SideStore la firma al instalarla.
      - name: Preparar el proyecto de Xcode
        run: flutter build ios --release --no-codesign --config-only

      - name: Compilar (sin firma)
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild             -workspace ios/Runner.xcworkspace             -scheme Runner             -configuration Release             -sdk iphoneos             -destination 'generic/platform=iOS'             -derivedDataPath build/xcode             CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""             DEVELOPMENT_TEAM=""             build 2>&1 | tee build/xcodebuild.log | grep -E "error:|warning: .*signing|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build/xcodebuild.log

      - name: Errores de Xcode (si falla)
        if: failure()
        run: grep -n -B2 -A6 "error:" build/xcodebuild.log | head -150 || tail -150 build/xcodebuild.log

      - name: Empaquetar Cartelera.ipa
        run: |
          rm -rf Payload Cartelera.ipa
          mkdir Payload
          cp -R build/xcode/Build/Products/Release-iphoneos/Runner.app Payload/
          zip -qry Cartelera.ipa Payload
          ls -lh Cartelera.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Cartelera-ipa
          path: app/Cartelera.ipa
          retention-days: 30

      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="ios-${{ github.run_number }}"
          gh release create "$TAG" Cartelera.ipa \
            --title "Cartelera iOS #${{ github.run_number }}" \
            --notes "IPA sin firmar para instalar con SideStore. Commit ${{ github.sha }}."
