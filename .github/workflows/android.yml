# Compila el APK de Android FIRMADO con la clave de Cartelera y lo publica en Releases.
# La app instalada mira estas Releases al abrirse y ofrece actualizar (lib/data/updater.dart).
#
# Se lanza al subir una etiqueta vX.Y.Z cuyo número coincida con `version:` de app/pubspec.yaml:
#   git tag v1.1.0 && git push origin v1.1.0
#
# Secretos del repositorio (Settings › Secrets and variables › Actions):
#   ANDROID_KEYSTORE_BASE64   el .jks en base64
#   ANDROID_KEYSTORE_PASSWORD contraseña del almacén
#   ANDROID_KEY_ALIAS         alias de la clave (cartelera)
#   ANDROID_KEY_PASSWORD      contraseña de la clave
name: Android

on:
  push:
    tags: ['v*']

permissions:
  contents: write # para crear la Release con el .apk

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar la versión
        id: version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PUB=$(grep -E '^version:' pubspec.yaml | sed -E 's/version:[[:space:]]*([^+]+).*/\1/')
          if [ "$TAG" != "$PUB" ]; then
            echo "::error::La etiqueta v$TAG no coincide con version: $PUB de pubspec.yaml"
            exit 1
          fi
          # versionCode creciente a partir del número: 1.2.3 → 10203.
          IFS=. read -r MA MI PA <<< "$TAG"
          echo "name=$TAG" >> "$GITHUB_OUTPUT"
          echo "code=$(( MA * 10000 + ${MI:-0} * 100 + ${PA:-0} ))" >> "$GITHUB_OUTPUT"

      - name: Clave de firma
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::Falta el secreto ANDROID_KEYSTORE_BASE64: sin la clave, el APK no podría actualizar la app instalada."
            exit 1
          fi
          echo "$KEYSTORE" | base64 -d > android/cartelera-release.jks
          {
            echo "storeFile=cartelera-release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter test --exclude-tags live

      - name: Compilar
        run: |
          flutter build apk --release --target-platform android-arm64 \
            --build-name=${{ steps.version.outputs.name }} \
            --build-number=${{ steps.version.outputs.code }}
          cp build/app/outputs/flutter-apk/app-release.apk "Cartelera-${{ steps.version.outputs.name }}.apk"
          ls -lh Cartelera-*.apk

      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "Cartelera-${{ steps.version.outputs.name }}.apk" \
            --title "Cartelera ${{ steps.version.outputs.name }}" \
            --generate-notes \
            --latest
